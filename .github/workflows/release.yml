name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # OpenAvalon grants this repository's Actions GITHUB_TOKEN read access to its packages.
  NuGetPackageSourceCredentials_openavalon-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  validate:
    name: Validate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
            flaui: true
          - name: macos-arm64
            runner: macos-15
            flaui: false
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 11 preview SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ matrix.name }}-${{ hashFiles('global.json', 'NuGet.config', 'source/**/*.csproj', 'source/**/*.props') }}
      - name: Prepare GitHub Packages restore access
        shell: pwsh
        run: |
          Copy-Item NuGet.config "$env:RUNNER_TEMP/NuGet.config"
          dotnet nuget update source openavalon-github --username $env:GITHUB_ACTOR --password $env:GITHUB_TOKEN --store-password-in-clear-text --configfile "$env:RUNNER_TEMP/NuGet.config"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependencies
        shell: pwsh
        run: |
          $projects = @(
            'source/Components/AvalonDock/AvalonDock.csproj',
            'source/Components/AvalonDock.Core/AvalonDock.Core.csproj',
            'source/Components/AvalonDock.Serializer.Xml/AvalonDock.Serializer.Xml.csproj',
            'source/Components/AvalonDock.Themes.VS/AvalonDock.Themes.VS.csproj',
            'source/Components/AvalonDock.Themes.VS2013/AvalonDock.Themes.VS2013.csproj',
            'source/AutomationTest/AvalonDockTest/AvalonDockTest.csproj'
          )
          foreach ($project in $projects) {
            dotnet restore $project --configfile "$env:RUNNER_TEMP/NuGet.config"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
            'source/Components/AvalonDock/AvalonDock.csproj',
            'source/Components/AvalonDock.Core/AvalonDock.Core.csproj',
            'source/Components/AvalonDock.Serializer.Xml/AvalonDock.Serializer.Xml.csproj',
            'source/Components/AvalonDock.Themes.VS/AvalonDock.Themes.VS.csproj',
            'source/Components/AvalonDock.Themes.VS2013/AvalonDock.Themes.VS2013.csproj',
            'source/AutomationTest/AvalonDockTest/AvalonDockTest.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project --configuration Release --no-restore --warnaserror
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test (Unit Tests, Windows)
        if: matrix.flaui
        env:
          DOTNET_ROLL_FORWARD: Major
        run: >
          dotnet test source/AutomationTest/AvalonDockTest/AvalonDockTest.csproj
          --configuration Release
          --no-restore
          --filter "Category!=FlaUI"
          --logger "trx;LogFilePrefix=unit-test-results"
          --results-directory TestResults
          -m:1

      - name: Test (FlaUI UI Tests)
        if: matrix.flaui
        env:
          DOTNET_ROLL_FORWARD: Major
        run: >
          dotnet test source/AutomationTest/AvalonDockTest/AvalonDockTest.csproj
          --configuration Release
          --no-restore
          --filter "Category=FlaUI"
          --framework net10.0-windows
          --logger "trx;LogFilePrefix=flaui-test-results"
          --results-directory TestResults
          -m:1

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/*.trx
          retention-days: 14

      - name: Pack the OpenDevelop package closure
        shell: pwsh
        run: |
          $projects = @(
            'source/Components/AvalonDock/AvalonDock.csproj',
            'source/Components/AvalonDock.Core/AvalonDock.Core.csproj',
            'source/Components/AvalonDock.Serializer.Xml/AvalonDock.Serializer.Xml.csproj',
            'source/Components/AvalonDock.Themes.VS2013/AvalonDock.Themes.VS2013.csproj',
            'source/Components/AvalonDock.Themes.VS/AvalonDock.Themes.VS.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project --configuration Release --no-build --no-restore -o nupkg
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          [xml]$props = Get-Content source/Directory.Build.props
          $version = $props.Project.PropertyGroup.VersionPrefix
          $expected = @(
            "Dirkster.AvalonDock.Core.$version.nupkg",
            "Dirkster.AvalonDock.LibreWPF.$version.nupkg",
            "Dirkster.AvalonDock.Serializer.Xml.$version.nupkg",
            "Dirkster.AvalonDock.Themes.VS.LibreWPF.$version.nupkg",
            "Dirkster.AvalonDock.Themes.VS2013.LibreWPF.$version.nupkg"
          )
          $actual = @(Get-ChildItem nupkg/*.nupkg | ForEach-Object Name)
          if (Compare-Object $expected $actual) { throw "Unexpected package closure: $($actual -join ', ')." }

      - name: Upload NuGet packages
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: nupkg/*.nupkg
          retention-days: 30
  publish:
    name: Publish GitHub Packages
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: nupkg
      - name: Determine whether this is the latest release
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          highest=$(git tag -l 'v*' | sed 's#^v##' | sort -V | tail -1)
          newest=$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -1)
          if [ "$newest" = "$version" ]; then echo 'MAKE_LATEST=true' >> "$GITHUB_OUTPUT"; else echo 'MAKE_LATEST=false' >> "$GITHUB_OUTPUT"; fi
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".Substring(1)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($package in Get-ChildItem nupkg/*.nupkg) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entry = @($archive.Entries | Where-Object Name -like '*.nuspec')
              if ($entry.Count -ne 1) { throw "$($package.Name) does not contain exactly one nuspec." }
              [xml]$nuspec = [System.IO.StreamReader]::new($entry.Open()).ReadToEnd()
              if ($nuspec.package.metadata.version -ne $version) { throw "$($package.Name) has version $($nuspec.package.metadata.version), not $version." }
            } finally { $archive.Dispose() }
          }
      - name: Push public packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push nupkg/*.nupkg --api-key $env:GITHUB_TOKEN --source https://nuget.pkg.github.com/lextudio/index.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: ${{ steps.version.outputs.MAKE_LATEST }}
          files: nupkg/*.nupkg
