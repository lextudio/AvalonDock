name: CI

on:
  pull_request:
    branches: [master, 'release/**']

permissions:
  contents: read
  packages: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # OpenAvalon grants this repository's Actions GITHUB_TOKEN read access to its packages.
  NuGetPackageSourceCredentials_openavalon-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 11 preview SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Setup .NET 10 runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'NuGet.config', 'source/**/*.csproj', 'source/**/*.props') }}

      - name: Prepare GitHub Packages restore access
        shell: pwsh
        run: |
          Copy-Item NuGet.config "$env:RUNNER_TEMP/NuGet.config"
          dotnet nuget update source openavalon-github --username $env:GITHUB_ACTOR --password $env:GITHUB_TOKEN --store-password-in-clear-text --configfile "$env:RUNNER_TEMP/NuGet.config"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore source/AvalonDock.sln --configfile "$env:RUNNER_TEMP/NuGet.config"

      - name: Build
        run: dotnet build source/AvalonDock.sln --configuration Release --no-restore --warnaserror

      - name: Test (Unit Tests)
        run: >
          dotnet test source/AvalonDock.sln
          --configuration Release
          --no-restore
          --filter "Category!=FlaUI"
          --logger "trx;LogFilePrefix=unit-test-results"
          --results-directory TestResults
          -m:1

      - name: Test (FlaUI UI Tests)
        run: >
          dotnet test source/AvalonDock.sln
          --configuration Release
          --no-restore
          --filter "Category=FlaUI"
          --framework net10.0-windows
          --logger "trx;LogFilePrefix=flaui-test-results"
          --results-directory TestResults
          -m:1

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14
